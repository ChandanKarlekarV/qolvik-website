<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Qolvik — link preview (1200×630)</title>
<!-- Source for assets/og-image.jpg. Re-render with headless Chrome at 1200×630, then convert to JPG. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #F4F2EC; color: #111; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; border: 0; }
  .tag { align-self: flex-start; padding: 12px 18px; border: 2px solid #111; background: #FBFAF6; font: 700 20px/1 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; transform: rotate(-1.6deg); }
  .tag b { font-weight: 800; }
  h1 { font: 800 82px/1.0 "Inter Tight", sans-serif; letter-spacing: -0.045em; max-width: 1000px; }
  .scribble { position: relative; white-space: nowrap; }
  .scribble svg { position: absolute; left: -2%; bottom: -12px; width: 104%; height: 24px; }
  .scribble path { fill: none; stroke: #C2501A; stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding-top: 22px; border-top: 2px solid #111; }
  .brand { display: flex; align-items: center; gap: 14px; font: 800 38px/1 "Inter Tight", sans-serif; letter-spacing: -0.04em; }
  .brand img { width: 48px; height: 48px; }
  .url { font: 800 22px/1 "JetBrains Mono", monospace; letter-spacing: .04em; }
</style>
</head>
<body>
  <span class="tag"><b>Campus ERP</b> · Made in Bengaluru</span>

</body>
</html>
