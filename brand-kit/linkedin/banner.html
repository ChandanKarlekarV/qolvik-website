<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Qolvik — LinkedIn banner</title>
<!-- Minimal brand banner, built on the site's design tokens (styles/tokens.css). -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../styles/tokens.css" />
<style>
  /* Render: personal 1584x396 (default) · company cover 1128x191 (banner.html?company) */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body { position: relative; display: grid; place-items: center; background: var(--mono-900); -webkit-font-smoothing: antialiased; }

  /* one soft copper glow behind the mark, a whisper of teal for depth */
  body::before { content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(420px 260px at 50% 50%, rgb(232 133 61 / .22), transparent 70%),
      radial-gradient(900px 420px at 50% 140%, rgb(194 80 26 / .28), transparent 70%),
      radial-gradient(700px 380px at 100% -20%, rgb(30 95 102 / .30), transparent 70%); }

  .lockup { position: relative; display: flex; align-items: center; gap: 26px; }
  .lockup img { width: 112px; height: 112px; filter: drop-shadow(0 12px 30px rgb(194 80 26 / .45)); }
  .lockup b { font: 700 104px/1 var(--font-display); letter-spacing: -.045em; color: var(--clay-50); }

  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--brand-gradient); }

  html.company, html.company body { width: 1128px; height: 191px; }
  .company .lockup { gap: 14px; }
  .company .lockup img { width: 62px; height: 62px; }
  .company .lockup b { font-size: 58px; }
  .company .rule { height: 3px; }
</style>
<script>if (location.search.includes("company")) document.documentElement.classList.add("company");</script>
</head>
<body>
  <div class="lockup"><img src="../../assets/qolvik-logo.png" alt="" /><b>Qolvik</b></div>
  <div class="rule"></div>
</body>
</html>
